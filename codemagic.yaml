workflows:
  ios-release:
    name: usitask iOS Build
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter packages
        script: |
          cd $CM_BUILD_DIR
          flutter pub get

      - name: Install CocoaPods dependencies
        script: |
          cd $CM_BUILD_DIR/ios
          pod install

      - name: Build iOS (no code signing)
        script: |
          cd $CM_BUILD_DIR
          flutter build ios --release --no-codesign

      - name: Create unsigned IPA
        script: |
          mkdir -p build/ios/ipa
          cd build/ios/Release-iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r ../ipa/usitask-unsigned.ipa Payload
          echo "IPA created at build/ios/ipa/usitask-unsigned.ipa"

    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/**/*.app
      - flutter_drive.log

    publishing:
      email:
        recipients:
          - azooz@example.com   # ← غيّر هذا لإيميلك
        notify:
          success: true
          failure: true
