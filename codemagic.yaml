workflows:
  ios-release:
    name: usitask iOS Build
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Flutter pub get
        script: flutter pub get
      - name: Pod install
        script: |
          find . -name "Podfile" -execdir pod install \;
      - name: Build iOS no-codesign
        script: flutter build ios --release --no-codesign
      - name: Package IPA
        script: |
          cd build/ios/Release-iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r usitask-unsigned.ipa Payload/
    artifacts:
      - build/ios/Release-iphoneos/usitask-unsigned.ipa
      - build/ios/**/*.app
